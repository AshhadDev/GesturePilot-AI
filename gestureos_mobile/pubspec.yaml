name: gesture_os
description: "GestureOS - Premium gesture-powered productivity application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Assets
  flutter_svg: ^2.0.16

  # Fonts
  google_fonts: ^6.2.1

  # Logging
  logger: ^2.5.0

  # Utils
  intl: ^0.20.2

  # Permissions (Android 13+ support)
  permission_handler: ^11.4.0

  # File thumbnails
  photo_manager: ^3.2.0

  # Camera
  camera: ^0.11.2

  # Storage & Identity
  shared_preferences: ^2.3.4

  # Crypto (SHA-256 for file verification)
  crypto: ^3.0.6
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3

  # Linting
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
