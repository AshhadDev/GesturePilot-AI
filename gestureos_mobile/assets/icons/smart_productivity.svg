<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
    <linearGradient id="grad1" x1="80" y1="30" x2="220" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100" y1="40" x2="200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Soft background glow -->
  <ellipse cx="150" cy="145" rx="85" ry="85" fill="#7C3AED" opacity="0.12" filter="url(#softglow)"/>

  <g filter="url(#glow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lightning bolt - main shape -->
    <path d="M160 45 L110 140 L140 140 L100 255"
          stroke="url(#grad1)" fill="none"/>
    <path d="M175 50 L125 145 L155 145 L115 250"
          stroke="url(#grad2)" fill="none" opacity="0.5"/>

    <!-- Orbital rings -->
    <ellipse cx="150" cy="148" rx="90" ry="35" stroke="url(#grad1)" fill="none" opacity="0.3"
             transform="rotate(-15 150 148)"/>
    <ellipse cx="150" cy="148" rx="80" ry="30" stroke="url(#grad2)" fill="none" opacity="0.2"
             transform="rotate(20 150 148)"/>

    <!-- Energy particles around bolt -->
    <circle cx="90" cy="100" r="2.5" fill="#A855F7" opacity="0.6"/>
    <circle cx="210" cy="95" r="2" fill="#7C3AED" opacity="0.5"/>
    <circle cx="80" cy="190" r="2" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="220" cy="200" r="2.5" fill="#A855F7" opacity="0.5"/>
    <circle cx="130" cy="65" r="1.5" fill="#7C3AED" opacity="0.4"/>
    <circle cx="180" cy="65" r="1.5" fill="#A855F7" opacity="0.3"/>
    <circle cx="120" cy="240" r="1.5" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="185" cy="235" r="2" fill="#7C3AED" opacity="0.35"/>

    <!-- Small connecting lines from particles -->
    <line x1="92" y1="100" x2="110" y2="120" stroke="#A855F7" stroke-width="1" opacity="0.25"/>
    <line x1="208" y1="95" x2="190" y2="115" stroke="#7C3AED" stroke-width="1" opacity="0.25"/>
    <line x1="82" y1="190" x2="105" y2="175" stroke="#8B5CF6" stroke-width="1" opacity="0.2"/>
    <line x1="218" y1="200" x2="195" y2="180" stroke="#A855F7" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Top decorative dot -->
  <circle cx="150" cy="25" r="1.5" fill="#7C3AED" opacity="0.35"/>
</svg>
